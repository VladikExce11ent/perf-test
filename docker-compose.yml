services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: perf-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - perf-net

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: perf-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - perf-net

  postgres:
    image: postgres:16-alpine
    container_name: perf-postgres
    environment:
      POSTGRES_DB: perf_db
      POSTGRES_USER: perf_user
      POSTGRES_PASSWORD: perf_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - perf-net

  kafka-consumer:
    build: ./kafka-consumer
    container_name: perf-kafka-consumer
    depends_on:
      - kafka
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/perf_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_FILE_NAME: /app/logs/kafka-consumer.log
    volumes:
      - ./kafka-consumer/logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - perf-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: perf-postgres-exporter
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_NAME: "postgresql://perf_user:perf_password@postgres:5432/perf_db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - perf-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: perf-kafka-exporter
    depends_on:
      - kafka
    restart: unless-stopped
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "9308:9308"
    networks:
      - perf-net

  prometheus:
    image: prom/prometheus:latest
    container_name: perf-prometheus
    depends_on:
      - postgres-exporter
      - kafka-exporter
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    networks:
      - perf-net

  grafana:
    image: grafana/grafana:latest
    container_name: perf-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - perf-net

  influxdb:
    image: influxdb:1.8
    container_name: perf-influxdb
    environment:
      - INFLUXDB_DB=jmeter
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    ports:
      - "8086:8086"
    volumes:
      - influxdbdata:/var/lib/influxdb
    networks:
      - perf-net

networks:
  perf-net:
    driver: bridge

volumes:
  pgdata:
  grafanadata:
  influxdbdata: